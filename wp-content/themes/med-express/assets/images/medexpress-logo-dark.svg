<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 80" role="img" aria-labelledby="title desc">
  <title id="title">Med Express Delivery Company</title>
  <desc id="desc">Med Express wordmark logo with bold typography and orange gradient accent.</desc>
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff8a24"/>
      <stop offset="100%" stop-color="#ff512f"/>
    </linearGradient>
  </defs>
  <rect width="340" height="80" rx="16" fill="#0c0c0f"/>
  <text x="30" y="53" font-family="'Poppins', 'Arial Black', sans-serif" font-size="46" font-weight="700" letter-spacing="2" fill="#ffffff">MED</text>
  <text x="165" y="53" font-family="'Poppins', 'Arial Black', sans-serif" font-size="46" font-weight="700" letter-spacing="1" fill="url(#grad)">EXPRESS</text>
  <text x="165" y="72" font-family="'Outfit', 'Arial', sans-serif" font-size="14" font-weight="500" letter-spacing="4" fill="#ffffff" opacity="0.85">DELIVERY COMPANY</text>
</svg>
